<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Commenter</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2481cc);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--secondary-bg);
            border-radius: 10px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--hint);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--btn);
            color: var(--btn-text);
        }

        .panel { display: none; }
        .panel.active { display: block; }

        h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--hint);
            margin-bottom: 6px;
            margin-top: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--secondary-bg);
            border-radius: 10px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--btn);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: var(--btn);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.7; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-danger {
            background: #ff3b30;
            color: #fff;
        }

        .info-card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(128,128,128,0.1);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label { color: var(--hint); font-size: 14px; }
        .info-value { font-weight: 600; font-size: 14px; }

        .range-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .range-group input[type="range"] {
            flex: 1;
            padding: 0;
            background: transparent;
            border: none;
        }

        .range-val {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            font-size: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-running { background: #34c759; color: #fff; }
        .status-done { background: var(--hint); color: #fff; }
        .status-error { background: #ff3b30; color: #fff; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab active" onclick="showTab('task')">Задача</button>
        <button class="tab" onclick="showTab('accounts')">Аккаунты</button>
        <button class="tab" onclick="showTab('settings')">Настройки</button>
    </div>

    <!-- Создание задачи -->
    <div id="panel-task" class="panel active">
        <h2>Новая задача</h2>

        <label>Поисковый запрос</label>
        <input type="text" id="query" placeholder="Например: заработок онлайн">

        <label>Текст комментария</label>
        <textarea id="comment" placeholder="Текст, который будет оставлен под видео"></textarea>

        <label>Лимит комментариев</label>
        <div class="range-group">
            <input type="range" id="limit" min="1" max="500" value="50" oninput="document.getElementById('limit-val').textContent=this.value">
            <span class="range-val" id="limit-val">50</span>
        </div>

        <button class="btn" onclick="createTask()">Запустить задачу</button>
    </div>

    <!-- Аккаунты -->
    <div id="panel-accounts" class="panel">
        <h2>Управление аккаунтами</h2>

        <label>Вставьте аккаунты (login:password, по строке)</label>
        <textarea id="accounts-input" rows="8" placeholder="user1@mail.com:password123&#10;user2@mail.com:pass456"></textarea>

        <button class="btn" onclick="uploadAccounts()">Загрузить аккаунты</button>

        <div style="margin-top: 12px; text-align: center;">
            <span style="color: var(--hint); font-size: 13px;">или</span>
        </div>

        <label>Загрузить из файла</label>
        <input type="file" id="file-input" accept=".txt" onchange="loadFile(event)" style="padding:8px;">
    </div>

    <!-- Настройки -->
    <div id="panel-settings" class="panel">
        <h2>Настройки</h2>

        <div class="info-card">
            <label>Макс. комментариев с 1 аккаунта в сутки</label>
            <div class="range-group" style="margin-top:8px;">
                <input type="range" id="max-per-day" min="5" max="200" value="50" oninput="document.getElementById('mpd-val').textContent=this.value">
                <span class="range-val" id="mpd-val">50</span>
            </div>

            <label>Задержка между комментариями (сек)</label>
            <div style="display:flex; gap:12px; margin-top:8px;">
                <div style="flex:1;">
                    <input type="number" id="delay-min" value="30" min="5" placeholder="Мин">
                    <span style="font-size:12px; color:var(--hint);">мин.</span>
                </div>
                <div style="flex:1;">
                    <input type="number" id="delay-max" value="90" min="10" placeholder="Макс">
                    <span style="font-size:12px; color:var(--hint);">макс.</span>
                </div>
            </div>
        </div>

        <button class="btn" onclick="saveSettings()">Сохранить настройки</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function showTab(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            event.target.classList.add('active');
        }

        function createTask() {
            const query = document.getElementById('query').value.trim();
            const comment = document.getElementById('comment').value.trim();
            const limit = document.getElementById('limit').value;

            if (!query || !comment) {
                tg.showAlert('Заполните запрос и текст комментария');
                return;
            }

            tg.sendData(JSON.stringify({
                action: 'create_task',
                query: query,
                comment: comment,
                limit: limit
            }));

            tg.showAlert('Задача отправлена!');
        }

        function uploadAccounts() {
            const raw = document.getElementById('accounts-input').value.trim();
            if (!raw) {
                tg.showAlert('Вставьте аккаунты');
                return;
            }

            tg.sendData(JSON.stringify({
                action: 'upload_accounts',
                accounts: raw
            }));

            tg.showAlert('Аккаунты отправлены!');
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('accounts-input').value = e.target.result;
            };
            reader.readAsText(file);
        }

        function saveSettings() {
            const maxPerDay = document.getElementById('max-per-day').value;
            const delayMin = document.getElementById('delay-min').value;
            const delayMax = document.getElementById('delay-max').value;

            tg.sendData(JSON.stringify({
                action: 'save_settings',
                max_per_day: maxPerDay,
                delay_min: delayMin,
                delay_max: delayMax
            }));

            tg.showAlert('Настройки сохранены!');
        }
    </script>
</body>
</html>
